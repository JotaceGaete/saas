# Configuración NO secreta de PostgREST para las pruebas de contrato de store-supabase.
# Los secretos y la cadena de conexión van SOLO por variables de entorno (PGRST_DB_URI,
# PGRST_JWT_SECRET), que PostgREST prefiere sobre este archivo. Nunca escribir secretos aquí.
db-schemas = "public"
db-anon-role = "anon"
server-host = "127.0.0.1"
server-port = 3999
db-pool = 2
