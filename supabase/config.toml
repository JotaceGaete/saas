# Supabase project config (optional).
# Edge Functions: mp-webhook is a public endpoint called by Mercado Pago; no user JWT.
[functions.mp-webhook]
verify_jwt = false

# create-mp-preference validates the JWT itself via supabase.auth.getUser().
[functions.create-mp-preference]
verify_jwt = false

# plan-change-preview: same, JWT validated inside for auth.uid().
[functions.plan-change-preview]
verify_jwt = false

# Aplica downgrades programados; puede llamarse con JWT o service_role (cron).
[functions.apply-scheduled-plan-changes]
verify_jwt = false

# Registro de visitas al catálogo público; sin JWT (llamado desde catálogo anónimo).
[functions.record-catalog-visit]
verify_jwt = false

# upload-image-r2 valida el JWT dentro de la función con supabase.auth.getUser().
[functions.upload-image-r2]
verify_jwt = false

# dLocal Go: integración eliminada. create-dlocal-checkout y dlocal-webhook son stubs 410 (no en uso).

# Paddle: checkout (JWT validado dentro) y webhook público.
[functions.create-paddle-checkout]
verify_jwt = false

[functions.paddle-webhook]
verify_jwt = false

# Mejora de descripción de producto con IA (JWT validado dentro).
[functions.improve-product-description]
verify_jwt = false
