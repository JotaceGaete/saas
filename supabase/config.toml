# Supabase project config (optional).
# Edge Functions: mp-webhook is a public endpoint called by Mercado Pago; no user JWT.
[functions.mp-webhook]
verify_jwt = false

# create-mp-preference validates the JWT itself via supabase.auth.getUser().
[functions.create-mp-preference]
verify_jwt = false

# MP-OAUTH-1: conexión OAuth de Mercado Pago por negocio (mp_connections),
# completamente aislada del billing de plataforma de arriba (no comparte
# tablas, tokens ni credenciales con create-mp-preference/mp-webhook).
# mp-oauth-start / mp-oauth-disconnect: igual que create-mp-preference,
# validan el JWT ellas mismas vía supabase.auth.getUser() (mismo motivo de
# CORS preflight que admin-users/admin-impersonate más abajo: OPTIONS no
# lleva Authorization, así que con verify_jwt=true el gateway respondería
# 401 antes de que el handler pueda contestar el preflight).
[functions.mp-oauth-start]
verify_jwt = false

[functions.mp-oauth-disconnect]
verify_jwt = false

# mp-oauth-callback: público, igual que mp-webhook — Mercado Pago redirige
# el browser acá directamente, sin JWT de Walinka.
[functions.mp-oauth-callback]
verify_jwt = false

# MP-CHECKOUT-1: checkout de Mercado Pago DEL COMERCIO (paga el cliente
# final del catálogo, no Walinka) -- completamente aislado de MP-OAUTH-1
# de arriba (no comparte tokens) y de create-mp-preference/mp-webhook
# (billing de plataforma). create-merchant-mp-checkout es público a
# propósito: el comprador del catálogo NO tiene sesión Walinka, así que
# no hay JWT que validar. "Público" no significa "confiable" -- toda
# validación de negocio/precio ocurre server-side dentro de la función.
[functions.create-merchant-mp-checkout]
verify_jwt = false

# MP-CHECKOUT-2: confirmación server-side de pagos del checkout de
# comercio de arriba -- público, igual que mp-webhook de billing:
# Mercado Pago llama a este endpoint directamente desde sus
# servidores, sin JWT de Walinka. El webhook nunca es la fuente de
# verdad (nunca confía en status/amount/currency/business_id/order_id
# del payload recibido) -- siempre re-consulta la API de Mercado Pago
# con el token del comercio antes de aplicar cualquier cambio.
[functions.merchant-mp-webhook]
verify_jwt = false

# MP-POINT-0: auditoría/diagnóstico de terminales Point de la cuenta MP
# conectada (mp_connections, MP-OAUTH-1) -- solo lectura, no crea
# órdenes ni cambia operating_mode. Mismo motivo que mp-oauth-disconnect:
# valida el JWT ella misma vía supabase.auth.getUser() (CORS preflight
# OPTIONS no lleva Authorization).
[functions.mp-point-terminals]
verify_jwt = false

# plan-change-preview: same, JWT validated inside for auth.uid().
[functions.plan-change-preview]
verify_jwt = false

# Aplica downgrades programados; puede llamarse con JWT o service_role (cron).
[functions.apply-scheduled-plan-changes]
verify_jwt = false

# Registro de visitas al catálogo público; sin JWT (llamado desde catálogo anónimo).
[functions.record-catalog-visit]
verify_jwt = false

[functions.record-catalog-whatsapp-click]
verify_jwt = false

# upload-image-r2 valida el JWT dentro de la función con supabase.auth.getUser().
[functions.upload-image-r2]
verify_jwt = false

# dLocal Go: integración eliminada. create-dlocal-checkout y dlocal-webhook son stubs 410 (no en uso).

# Mejora de descripción de producto con IA (JWT validado dentro).
[functions.improve-product-description]
verify_jwt = false

[functions.dashboard-ai-insights]
verify_jwt = false

# send-email: TEMPORAL para pruebas sin JWT en desarrollo.
# Para reactivar la protección JWT, cambiar verify_jwt a true o eliminar esta sección.
[functions.send-email]
verify_jwt = false

# EMAIL-PAYMENTS-1D: process-email-queue se invoca desde pg_cron (net.http_post
# con anon_key/apikey, nunca un JWT de usuario) -- con verify_jwt=true (el
# default de la plataforma cuando no hay entrada acá) el gateway devolvería
# 401 antes de que el handler pudiera ejecutarse. NO es una función pública
# sin protección: exige su propio header x-email-secret, comparado
# server-side contra EMAIL_FUNCTION_SECRET (ver supabase/functions/process-email-queue/index.ts) --
# esa validación interna no se debilita ni se reemplaza por esto, es la capa
# de auth real de esta función.
[functions.process-email-queue]
verify_jwt = false

# send-daily-summary: llamado por cron (pg_cron); sin JWT de usuario.
[functions.send-daily-summary]
verify_jwt = false

# generate-og-image: CORS preflight (`OPTIONS`) no incluye el JWT real en el navegador,
# así que desactivar verify_jwt permite que el handler responda el `OPTIONS` correctamente.
[functions.generate-og-image]
verify_jwt = false

# admin-users: JWT y rol admin validados internamente por la función (líneas 29-45).
# verify_jwt=false es necesario para que el gateway no rechace el CORS preflight:
# OPTIONS no incluye Authorization, por lo que con verify_jwt=true el gateway
# devuelve 401 antes de que el handler pueda responder al preflight correctamente.
[functions.admin-users]
verify_jwt = false

# admin-impersonate: misma razón que admin-users — JWT y rol admin validados dentro.
# El preflight OPTIONS no lleva Authorization; con verify_jwt=true el gateway devuelve
# 401 {"error":"Method not allowed"} antes de que el handler responda al preflight.
[functions.admin-impersonate]
verify_jwt = false
