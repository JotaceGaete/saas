name: Fiscal Point safety tests

on:
  push:
    branches:
      - feat/boleta-documento-ui
    paths:
      - 'api/_lib/siisolutions-sweep.js'
      - 'api/_lib/siisolutions-sweep.test.js'
      - 'api/fiscal/sweep-point.js'
      - 'api/fiscal/download.js'
      - 'api/fiscal/download.test.js'
      - '.github/workflows/fiscal-point-tests.yml'
  pull_request:
    paths:
      - 'api/_lib/siisolutions-sweep.js'
      - 'api/_lib/siisolutions-sweep.test.js'
      - 'api/fiscal/sweep-point.js'
      - '.github/workflows/fiscal-point-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiscal-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated fiscal test dependency (repository has no lockfile)
        run: |
          npm install --prefix /tmp/fiscal-test-deps --no-save --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2.100.1
          ln -s /tmp/fiscal-test-deps/node_modules node_modules
      - name: Run fiscal safety tests (no secrets or database)
        run: node --test api/_lib/siisolutions-sweep.test.js api/fiscal/download.test.js
