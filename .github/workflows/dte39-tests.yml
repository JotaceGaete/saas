name: DTE39 fiscal safety tests
on:
  pull_request:
    paths:
      - 'api/sii/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dte39-tests.yml'
  workflow_dispatch:
jobs:
  fiscal-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test runner
        run: |
          mkdir -p /tmp/walinka-fiscal-tests
          cd /tmp/walinka-fiscal-tests
          printf '{"private":true,"type":"module"}\n' > package.json
          yarn add --non-interactive --no-lockfile vitest@4.1.1
          printf 'export default { test: { environment: "node" } };\n' > vitest.config.mjs
      - name: Run fiscal tests without app dependencies
        run: /tmp/walinka-fiscal-tests/node_modules/.bin/vitest run --config /tmp/walinka-fiscal-tests/vitest.config.mjs api/sii/lib/dtecore39.test.js api/sii/lib/preparePosDte39.test.js api/sii/lib/posDte39Payment.test.js api/sii/lib/previewPaidPosDte39.test.js api/sii/lib/voucherSafety.test.js
