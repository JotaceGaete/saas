name: Supabase Daily Backup

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gzip

      - name: Create backup folder
        run: mkdir -p backups

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DATE=$(date +%F)

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL is empty"
            exit 1
          fi

          FINAL_URL="${SUPABASE_DB_URL}"

          case "$FINAL_URL" in
            *\?*)
              FINAL_URL="${FINAL_URL}&sslmode=require"
              ;;
            *)
              FINAL_URL="${FINAL_URL}?sslmode=require"
              ;;
          esac

          echo "Creating backup for $DATE"
          pg_dump "$FINAL_URL" | gzip > "backups/supabase-backup-$DATE.sql.gz"

          FILE="backups/supabase-backup-$DATE.sql.gz"

          if [ ! -s "$FILE" ]; then
            echo "Backup file was not created or is empty"
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")
          echo "Backup size: $SIZE bytes"

          if [ "$SIZE" -lt 1024 ]; then
            echo "Backup file is suspiciously small"
            exit 1
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backups/*.sql.gz
