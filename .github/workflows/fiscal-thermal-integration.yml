name: Fiscal thermal integration checks
on:
  pull_request:
    paths:
      - 'src/lib/fiscal/dte/**'
      - 'supabase/functions/fiscal-emit/**'
      - 'src/lib/printing/receipts/**'
      - 'src/pages/crm/CrmTerminal*'
      - 'src/pages/crm/components/CrmThermalTicket*'
      - 'src/lib/printing/printService*'
      - 'src/services/fiscalThermalPrintService*'
      - 'src/pages/crm/components/TpvFiscalEmitPanel*'
      - 'src/pages/crm/CrmFiscalThermalPrint.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fiscal-thermal-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thermal-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify clean install using committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify thermal and TPV components
        run: npx vitest run src/lib/fiscal/dte/parseDteXml.test.js src/lib/fiscal/dte/tedPdf417.test.js src/lib/printing/receipts/buildBoletaReceipt.test.js src/services/fiscalThermalPrintService.test.js src/pages/crm/components/TpvFiscalEmitPanel.test.jsx
      - name: Protect existing commercial ticket and TPV
        run: npx vitest run src/pages/crm/components/CrmThermalTicket.fiscalIntegration.test.js src/lib/printing/receipts/buildSaleReceipt.test.js src/lib/printing/receipts/renderEscPosReceipt.test.js src/lib/printing/receipts/escPosImage.test.js
      - name: Verify DTE Core HTTP uncertainty and duplicate prevention
        run: node --test supabase/functions/fiscal-emit/test/unit/siisolutions-http.test.mjs
      - name: Build frontend
        run: npm run build
