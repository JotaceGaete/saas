name: Fiscal thermal integration checks
on:
  pull_request:
    paths:
      - 'src/lib/fiscal/dte/**'
      - 'supabase/functions/fiscal-emit/**'
      - 'supabase/fiscal-recovery/localdb/**'
      - 'src/lib/printing/receipts/**'
      - 'src/pages/crm/CrmTerminal*'
      - 'src/pages/crm/components/CrmThermalTicket*'
      - 'src/lib/printing/printService*'
      - 'src/services/fiscalThermalPrintService*'
      - 'src/pages/crm/components/TpvFiscalEmitPanel*'
      - 'src/pages/crm/CrmFiscalThermalPrint.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fiscal-thermal-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thermal-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify clean install using committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify thermal and TPV components
        run: npx vitest run src/lib/fiscal/dte/parseDteXml.test.js src/lib/fiscal/dte/tedPdf417.test.js src/lib/printing/receipts/buildBoletaReceipt.test.js src/services/fiscalThermalPrintService.test.js src/pages/crm/components/TpvFiscalEmitPanel.test.jsx
      - name: Protect existing commercial ticket and TPV
        run: npx vitest run src/pages/crm/components/CrmThermalTicket.fiscalIntegration.test.js src/lib/printing/receipts/buildSaleReceipt.test.js src/lib/printing/receipts/renderEscPosReceipt.test.js src/lib/printing/receipts/escPosImage.test.js
      - name: Verify DTE Core HTTP uncertainty and duplicate prevention
        run: node --test supabase/functions/fiscal-emit/test/unit/siisolutions-http.test.mjs supabase/functions/fiscal-emit/test/unit/recovery-safety.test.mjs supabase/functions/fiscal-emit/test/unit/reconciler.test.mjs supabase/functions/fiscal-emit/test/unit/recovery-http.test.mjs supabase/functions/fiscal-emit/test/unit/state.test.mjs supabase/functions/fiscal-emit/test/unit/failures.memory.test.mjs supabase/functions/fiscal-emit/test/unit/late-and-double.test.mjs supabase/functions/fiscal-emit/test/unit/store-supabase.test.mjs supabase/functions/fiscal-emit/test/unit/postgrest-client.test.mjs
      - name: Validate local fiscal DB and PostgREST harness scripts
        run: bash -n supabase/fiscal-recovery/localdb/build.sh supabase/functions/fiscal-emit/scripts/postgrest-contract/run.sh
      - name: Verify PostgREST guard rejects unsafe targets
        run: bash supabase/functions/fiscal-emit/scripts/postgrest-contract/guard.test.sh
      - name: Verify local PostgreSQL rebuild guard
        run: bash supabase/fiscal-recovery/localdb/guard.test.sh
      - name: Verify PostgREST readiness fail-closed
        run: bash supabase/functions/fiscal-emit/scripts/postgrest-contract/readiness.test.sh
      - name: Verify fiscal SQL migration failures abort local rebuild
        run: bash supabase/fiscal-recovery/localdb/migration-failure.test.sh
      - name: Verify skipped migrations cannot certify a complete local DB
        run: bash supabase/fiscal-recovery/localdb/partial-migrations.test.sh
      - name: Verify PostgREST refuses preoccupied local port
        run: node --test supabase/functions/fiscal-emit/scripts/postgrest-contract/occupied-port.test.mjs
      - name: Build frontend
        run: npm run build
